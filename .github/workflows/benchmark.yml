name: benchmark

# Accuracy and parity on trafilatura's evaluation corpus; fails if F1 drops below benchmark/floors.json.
# Speeds measured on shared runners are noisy, so only the accuracy part runs here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run accuracy and parity
        run: benchmark/run.sh accuracy
      - name: Check F1 floors
        run: benchmark/python/.venv/bin/python benchmark/python/gate.py benchmark/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark/results/*.csv
            benchmark/results/*.md
            benchmark/results/*.svg
